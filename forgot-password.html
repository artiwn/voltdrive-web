<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0d"><title>Reset password — VoltDrive</title><link rel="icon" href="./assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./css/core/reset.css"><link rel="stylesheet" href="./css/core/variables.css"><link rel="stylesheet" href="./css/core/typography.css"><link rel="stylesheet" href="./css/components/forms.css"><link rel="stylesheet" href="./css/components/buttons.css"><link rel="stylesheet" href="./css/pages/auth.css"><link rel="stylesheet" href="./css/core/metallic-theme.css"></head><body class="auth-page"><div class="auth-layout"><aside class="auth-showcase"><a class="brand" href="./login.html"><span class="brand__mark">ϟ</span><span>VoltDrive</span></a><section class="showcase-copy"><span class="eyebrow">Account recovery</span><h1>Reset access.<br>Return to charging.</h1><p>Enter your account email and we will prepare a secure password-reset link.</p></section></aside><main class="auth-main"><section class="auth-card"><a class="back-link" href="./login.html">← Back to sign in</a><header class="auth-card__header"><span class="eyebrow">Forgot password</span><h2>Reset your password.</h2><p>For this prototype, submitting the form displays a successful reset request.</p></header><form class="form" id="forgot-form"><div class="form-message" id="forgot-message" role="status"></div><label class="field"><span class="field__label">Email address</span><span class="field__control"><input name="email" type="email" value="driver@voltdrive.am" required></span></label><button class="button button--primary button--block" type="submit">Send reset link</button></form></section></main></div><script type="module">const f=document.querySelector('#forgot-form'),m=document.querySelector('#forgot-message');f.addEventListener('submit',e=>{e.preventDefault();m.textContent='Reset link prepared. Check your email.';m.classList.add('is-visible')});</script></body></html>
