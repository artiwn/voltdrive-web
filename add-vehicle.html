<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0d"><meta name="mobile-web-app-capable" content="yes"><title>Add vehicle — VoltDrive</title><link rel="stylesheet" href="./css/core/reset.css"><link rel="stylesheet" href="./css/core/variables.css"><link rel="stylesheet" href="./css/core/typography.css"><link rel="stylesheet" href="./css/components/forms.css"><link rel="stylesheet" href="./css/components/buttons.css"><link rel="stylesheet" href="./css/pages/auth.css"><link rel="stylesheet" href="./css/pages/add-vehicle.css"><link rel="stylesheet" href="./css/core/metallic-theme.css"></head><body class="auth-page"><div class="auth-layout"><aside class="auth-showcase vehicle-showcase"><a class="brand" href="./login.html"><span class="brand__mark">⚡</span><span>VoltDrive</span></a><section class="showcase-copy"><span class="eyebrow">Step 3 of 4</span><h1>Add your electric vehicle.</h1><p>Vehicle details help us show compatible connectors, suitable charger power and accurate charging estimates.</p></section><div class="vehicle-preview"><div class="vehicle-preview__car">EV</div><div><strong id="vehicle-preview-name">Tesla Model Y</strong><span id="vehicle-preview-meta">CCS2 · 75 kWh</span></div></div></aside><main class="auth-main"><section class="auth-card auth-card--wide"><header class="auth-card__header"><span class="eyebrow">Vehicle garage</span><h2>Tell us about your EV.</h2><p>This vehicle will become your active vehicle.</p></header><form class="form" id="vehicle-form"><div class="form-row"><label class="field"><span class="field__label">Manufacturer</span><input name="manufacturer" value="Tesla" required></label><label class="field"><span class="field__label">Model</span><input name="model" value="Model Y" required></label></div><div class="form-row"><label class="field"><span class="field__label">Registration number</span><input name="registration" value="35 EV 777" required></label><label class="field"><span class="field__label">Battery capacity</span><input name="batteryCapacity" type="number" min="1" value="75" required></label></div><div class="form-row"><label class="field"><span class="field__label">Compatible connector</span><select name="connector"><option selected>CCS2</option><option>CHAdeMO</option><option>Type 2</option><option>NACS</option></select></label><label class="field"><span class="field__label">Preferred charging limit</span><select name="chargingLimit"><option>70%</option><option selected>80%</option><option>90%</option><option>100%</option></select></label></div><label class="checkbox"><input name="plugAndCharge" type="checkbox" checked><span>Enable Plug & Charge when supported by the vehicle and charger.</span></label><button class="button button--primary button--block" type="submit">Save vehicle and continue</button></form></section></main></div><script type="module" src="./js/pages/add-vehicle.js"></script></body></html>
